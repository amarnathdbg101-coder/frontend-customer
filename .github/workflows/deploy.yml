name: ShopSilo Customer Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  quality-check-and-build:
    name: Code Quality, Typecheck & Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Linter (oxlint)
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Test Production Vite Build
        run: npm run build
        env:
          VITE_API_BASE_URL: https://api.shopsilo.in
          VITE_GOOGLE_CLIENT_ID: 328255141048-v4r4fga1oas928b5imvh9jpbaemrc9a8.apps.googleusercontent.com

      - name: Upload Bundle Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-stats-report
          path: dist/stats.html
          retention-days: 7

  deploy-production:
    name: Deploy to Production
    needs: quality-check-and-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build Production Assets
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://api.shopsilo.in' }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: 'shopsilo-customer'
          directory: 'dist'
