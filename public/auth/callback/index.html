<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating with ShopSilo...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      border: 1px solid #e2e8f0;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
    }
    .logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 26px;
      margin: 0 auto 24px;
      box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
    p {
      color: #64748b;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #4f46e5;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-block;
      background: #4f46e5;
      color: white;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 15px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #4338ca;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">S</div>
    <div class="spinner"></div>
    <h1>Redirecting to ShopSilo...</h1>
    <p>Please wait while we verify your Google authentication and return you to the ShopSilo App.</p>
    <a href="#" id="open-app-btn" class="btn" style="display: none;">Open ShopSilo App</a>
  </div>

  <script>
    (function() {
      var fullSearch = window.location.search || '';
      var fullHash = window.location.hash || '';
      var deepLink = 'shopsilo://auth/callback' + fullSearch + fullHash;

      // Auto redirect to native app deep link
      window.location.href = deepLink;

      // Show manual fallback button after 1 second if app didn't capture automatically
      setTimeout(function() {
        var btn = document.getElementById('open-app-btn');
        if (btn) {
          btn.href = deepLink;
          btn.style.display = 'inline-block';
        }
      }, 1000);
    })();
  </script>
</body>
</html>
