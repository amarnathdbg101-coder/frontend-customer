<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="canonical" href="https://shopsilo.in/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2'><path d='M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>ShopSilo - Hyperlocal Retail Marketplace | शॉपसिलो हाइपरलोकल बाजार</title>
    <meta name="description" content="ShopSilo connects you with verified neighborhood stores for real-time inventory discovery, bargain offers, and instant 30-minute counter pickup reservations." />
    <meta name="keywords" content="ShopSilo, hyperlocal retail, local shops, grocery pickup, store inventory, digital khata, nearby market" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="color-scheme" content="light dark" />

    <!-- OpenGraph / Social Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ShopSilo - Hyperlocal Retail Marketplace" />
    <meta property="og:description" content="Discover verified neighborhood stores, real-time inventory, and instant counter pickup reservations." />
    <meta property="og:site_name" content="ShopSilo" />

    <!-- Twitter Meta Tags -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ShopSilo - Hyperlocal Retail Marketplace" />
    <meta name="twitter:description" content="Discover verified neighborhood stores, real-time inventory, and instant counter pickup reservations." />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "ShopSilo Hyperlocal Market",
      "url": "https://shopsilo.in",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://shopsilo.in/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <!-- Preconnect to backend API for faster requests -->
    <link rel="preconnect" href="https://api.shopsilo.in" crossorigin />
    <link rel="dns-prefetch" href="https://api.shopsilo.in" />

    <!-- Google Fonts: Inter & Noto Sans Devanagari -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
